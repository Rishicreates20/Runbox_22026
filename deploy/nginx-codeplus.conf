# /etc/nginx/sites-available/codeplus  (replace codeplus.example.com)
server {
    listen 80;
    server_name codeplus.example.com;

    client_max_body_size 64m;  # problem uploads

    # Server-Sent Events: no buffering, long reads. The app also sends
    # X-Accel-Buffering: no, and a heartbeat every 15 s.
    location /api/execution/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
