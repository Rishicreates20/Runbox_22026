server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # add_header in a location replaces the server-level ones, so the
    # security headers are repeated in each location.

    # Hashed build assets never change, so cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Client-side routing: unknown paths fall back to the app.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        try_files $uri /index.html;
    }
}
