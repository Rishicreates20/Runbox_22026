# Local Postgres + Redis for development (the judge itself runs on the host,
# as root, because runbox needs the host kernel).
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: codeplus, POSTGRES_PASSWORD: codeplus, POSTGRES_DB: codeplus }
    ports: ["127.0.0.1:5432:5432"]
  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]
