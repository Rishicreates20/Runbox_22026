name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web app (typecheck + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Production build (demo mode, no backend)
        run: npm run build
      - name: Static build (hash routing, relative base)
        run: npm run build:static

  sandbox:
    name: runbox sandbox tests (cgroup v2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build runbox (warnings are errors)
        run: make
        env:
          CFLAGS: -O2 -g -Werror
      - name: Build sandbox images
        run: |
          sudo scripts/make-rootfs.sh /var/lib/runbox/rootfs --python /usr/bin/python3
          sudo scripts/make-rootfs.sh /var/lib/runbox/rootfs-gcc --python /usr/bin/python3 --gcc
      - name: Host cgroup layout
        run: stat -fc %T /sys/fs/cgroup && cat /sys/fs/cgroup/cgroup.controllers
      # GitHub's Ubuntu 24.04 runners use the unified cgroup v2 hierarchy,
      # so this exercises runbox's v2 path on every push.
      - name: Sandbox tests
        run: sudo python3 tests/run_tests.py --cgroup v2

  docker:
    name: Docker images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          tags: codeplus-web:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test web image (SPA fallback)
        run: |
          docker run -d --rm --name web -p 8080:8080 codeplus-web:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/problems/42 >/dev/null && break; sleep 1; done
          curl -fsS localhost:8080/problems/42 | grep -q '<div id="root">'
          docker stop web
      - name: Build runbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runbox
          tags: codeplus-runbox:ci
          load: true
          cache-from: type=gha
      - name: Sandbox tests inside the container
        run: docker run --rm --privileged --cgroupns private --tmpfs /tmp/runbox codeplus-runbox:ci
